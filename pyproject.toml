[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-telephone"
version = "0.2.0"
description = "Reproducible recursive translation experiments for prose"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
local-mt = [
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "sentencepiece>=0.2,<1",
  "sacremoses>=0.1,<1",
]
semantic-metrics = [
  "sentence-transformers>=3,<6",
]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
  "pytest-socket>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
semantic-telephone = "semantic_telephone.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_telephone = [
  "py.typed",
  "resources/prompts/*.txt",
  "resources/profiles/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semantic_telephone"]
