run:
  name: translate_only
  seed: 1080
  source_language: ru
  target_language: ru
  output_root: runs
input:
  path: ../input.txt
  encoding: utf-8
chunking: &chunking
  strategy: target_chars
  target_chars: 1100
  max_chars: 1800
  paragraph_overlap: 1
translation:
  provider: mock
  route_mode: fixed
  languages: [ru, ka, ar, ja, hr, sw, de, hi, en, ru]
  min_hops: 5
  max_hops: 9
generation:
  provider: mock
  model: mock
context:
  enabled: false
memory:
  enabled: false
pipeline:
  - type: translation_cycle
    hops: {min: 5, max: 9}
  - type: final_translation
runtime: &runtime
  concurrency: 1
  requests_per_minute: 30
  retries: 4
  retry_backoff_seconds: 0.01
  failure_policy: stop

