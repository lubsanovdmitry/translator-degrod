run:
  name: m2m100_only
  seed: 1080
  source_language: ru
  target_language: ru
  output_root: runs
input: {path: ../input.txt, encoding: utf-8}
chunking: {strategy: target_chars, target_chars: 900, max_chars: 1800}
translation:
  default_provider: m2m100
  route_mode: fixed
  languages: [ru, ka, ar, ja, de, en, ru]
  providers:
    m2m100:
      type: m2m100
      model: facebook/m2m100_418M
      device: auto
      dtype: auto
      max_input_tokens: 450
      decoding: {mode: greedy, num_beams: 1, max_new_tokens: 512, no_repeat_ngram_size: 3}
  engine_routing: {mode: single_engine, provider: m2m100}
generation:
  provider: openrouter
  api_key_env: OPENROUTER_API_KEY
  parameters:
    reasoning: {enabled: false}
  tasks:
    conservative_repair: {max_tokens: 2048}
    reconstruction: {max_tokens: 4096}
    contextual_reconstruction: {max_tokens: 4096}
    memory_extraction: {max_tokens: 2048}
    report_generation: {max_tokens: 2048}
  temperature: {report_generation: 0.2}
context: {enabled: false}
memory: {enabled: false}
pipeline:
  - type: translation_cycle
  - type: final_translation
runtime: {retries: 4, retry_backoff_seconds: 2, failure_policy: stop}
